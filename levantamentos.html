<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SACC — Levantamentos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy: #1e3a5f;
      --navy-light: #2a4a72;
      --white: #ffffff;
      --gray: #6b7280;
      --gray-light: #f3f5f8;
      --border: #d1dae6;
      --success: #16a34a;
      --danger: #dc2626;
      --info: #0ea5e9;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--gray-light);
      color: var(--navy);
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    .topbar-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
    }

    .topbar-title {
      font-size: 13px;
      font-weight: 400;
      color: var(--gray);
    }

    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 8px;
    }

    .nav-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--gray);
      text-decoration: none;
      padding: 6px 13px;
      border-radius: 6px;
      transition: all 0.15s;
    }

    .nav-link:hover {
      background: var(--gray-light);
      color: var(--navy);
    }

    .nav-link.active {
      background: #e8eef7;
      color: var(--navy);
      font-weight: 600;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-user {
      font-size: 12px;
      color: var(--gray);
    }

    .topbar-user strong {
      color: var(--navy);
      font-weight: 600;
    }

    .btn-sair {
      font-size: 12px;
      color: var(--gray);
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-sair:hover {
      border-color: var(--navy);
      color: var(--navy);
    }

    /* ── Conteúdo ── */
    .container {
      max-width: 1400px;
      margin: 36px auto;
      padding: 0 24px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .page-header h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--navy);
    }

    .btn-novo {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: var(--success);
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .btn-novo:hover {
      background: #15803d;
    }

    /* ── Layout Principal ── */
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
    }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 70vh;
    }

    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--gray-light);
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sidebar-list {
      overflow-y: auto;
      flex: 1;
    }

    .sidebar-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--navy);
      transition: background 0.15s;
      position: relative;
    }

    .sidebar-item:hover {
      background: var(--gray-light);
    }

    .sidebar-item.active {
      background: #e8eef7;
      font-weight: 600;
    }

    .sidebar-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gray);
      flex-shrink: 0;
    }

    .sidebar-item.active .sidebar-dot {
      background: var(--navy);
    }

    .sidebar-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-delete {
      background: none;
      border: none;
      color: var(--gray);
      cursor: pointer;
      padding: 4px;
      opacity: 0;
      transition: all 0.15s;
    }

    .sidebar-item:hover .sidebar-delete {
      opacity: 1;
    }

    .sidebar-delete:hover {
      color: var(--danger);
    }

    /* ── Área Principal ── */
    .main {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      min-height: 70vh;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--gray);
      gap: 16px;
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      opacity: 0.3;
    }

    .empty-text {
      font-size: 14px;
    }

    .titulo {
      font-size: 18px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 24px;
    }

    /* ── Filtros ── */
    .filtros {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filtro-input {
      flex: 1;
      min-width: 200px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      color: var(--navy);
    }

    .filtro-input:focus {
      outline: none;
      border-color: var(--navy);
    }

    /* ── Tabela ── */
    .tabela {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .tabela thead {
      background: var(--gray-light);
      border-bottom: 1px solid var(--border);
    }

    .tabela th {
      text-align: left;
      padding: 11px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tabela th:last-child {
      text-align: right;
    }

    .tabela tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }

    .tabela tbody tr:hover {
      background: #f0f4fa;
    }

    .tabela td {
      padding: 12px;
      color: var(--navy);
    }

    .td-nome {
      font-weight: 500;
    }

    .td-setor {
      font-size: 12px;
      color: var(--gray);
    }

    /* ── Botões de Opção ── */
    .opcoes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn-opcao {
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: var(--white);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      color: var(--gray);
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-opcao:hover {
      border-color: var(--navy);
      color: var(--navy);
    }

    .btn-opcao.selected {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.2s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      width: 450px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(12px);
      transition: transform 0.2s;
    }

    .modal-overlay.open .modal {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--navy);
    }

    .btn-close-modal {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray);
      padding: 2px;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .btn-close-modal:hover {
      color: var(--navy);
    }

    .modal-body {
      padding: 22px 24px 24px;
      overflow-y: auto;
      flex: 1;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      color: var(--navy);
      background: var(--white);
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--navy);
    }

    .opcoes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .opcao-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .opcao-num {
      font-size: 12px;
      color: var(--gray);
      min-width: 30px;
      text-align: center;
    }

    .opcao-row input {
      flex: 1;
    }

    .btn-submit {
      width: 100%;
      margin-top: 6px;
      padding: 11px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      color: #fff;
      background: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .btn-submit:hover {
      background: #15803d;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .msg {
      font-size: 12px;
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      display: none;
    }

    .msg.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      display: block;
    }

    .msg.success {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
      display: block;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--navy);
      color: #fff;
      font-size: 13px;
      padding: 11px 18px;
      border-radius: 7px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.2s, transform 0.2s;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--gray-light);
      padding: 14px;
      border-radius: 6px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--gray);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--navy);
    }

    .stat-opcao {
      font-size: 12px;
      color: var(--gray);
      margin-top: 4px;
    }
  </style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-left">
    <span class="logo">SACC</span>
    <div class="topbar-sep"></div>
    <span class="topbar-title">Sistema Administrativo</span>
    <div class="topbar-sep"></div>
    <nav class="topbar-nav">
      <a href="dashboard.html" class="nav-link">Funcionários</a>
      <a href="bancohoras.html" class="nav-link">Banco de Horas</a>
      <a href="ferias.html" class="nav-link">Férias</a>
      <a href="escala.html" class="nav-link">Escala</a>
      <a href="levantamentos.html" class="nav-link active">Levantamentos</a>
    </nav>
  </div>
  <div class="topbar-right">
    <span class="topbar-user">Olá, <strong id="user-name">—</strong></span>
    <button class="btn-sair" onclick="logout()">Sair</button>
  </div>
</div>

<!-- Container Principal -->
<div class="container">
  <div class="page-header">
    <h1>Levantamentos</h1>
    <button class="btn-novo" onclick="openNewModal()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Novo Levantamento
    </button>
  </div>

  <div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">Levantamentos</div>
      <div class="sidebar-list" id="sidebar-list">
        <div style="padding: 20px; text-align: center; color: var(--gray); font-size: 13px;">
          Carregando...
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main" id="main-content">
      <div class="empty-state">
        <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <p class="empty-text">Selecione um levantamento para começar</p>
      </div>
    </div>
  </div>
</div>

<!-- Modal Novo Levantamento -->
<div class="modal-overlay" id="modal-novo" onclick="closeModalIfOut(event, 'modal-novo')">
  <div class="modal">
    <div class="modal-header">
      <h2>Novo Levantamento</h2>
      <button class="btn-close-modal" onclick="closeModal('modal-novo')">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="assunto">Título do Levantamento</label>
        <input id="assunto" type="text" placeholder="Ex: Vacinação da Gripe" />
      </div>

      <div class="field">
        <label for="descricao">Descrição (opcional)</label>
        <textarea id="descricao" placeholder="Descreva o levantamento..." style="resize: vertical; min-height: 60px;"></textarea>
      </div>

      <div class="field">
        <label>Opções (de 1 a 5)</label>
        <div class="opcoes-list">
          <div class="opcao-row">
            <span class="opcao-num">1</span>
            <input type="text" class="opcao-input" placeholder="Opção 1" data-num="1" />
          </div>
          <div class="opcao-row">
            <span class="opcao-num">2</span>
            <input type="text" class="opcao-input" placeholder="Opção 2 (opcional)" data-num="2" />
          </div>
          <div class="opcao-row">
            <span class="opcao-num">3</span>
            <input type="text" class="opcao-input" placeholder="Opção 3 (opcional)" data-num="3" />
          </div>
          <div class="opcao-row">
            <span class="opcao-num">4</span>
            <input type="text" class="opcao-input" placeholder="Opção 4 (opcional)" data-num="4" />
          </div>
          <div class="opcao-row">
            <span class="opcao-num">5</span>
            <input type="text" class="opcao-input" placeholder="Opção 5 (opcional)" data-num="5" />
          </div>
        </div>
      </div>

      <button class="btn-submit" id="btn-criar" onclick="createLevantamento()">Criar Levantamento</button>
      <div class="msg" id="msg-novo"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ── Config ──
  const SUPABASE_URL = 'https://uxtakyijomozrraazuxi.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV4dGFreWlqb21venJyYWF6dXhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MzgyNDIsImV4cCI6MjA5MDUxNDI0Mn0.uKeMN7NdNaLk9cyeli9BBZLjTLkPFbPqKic1mFfIJss';

  const headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
  };

  // ── Estado ──
  let levantamentos = [];
  let funcionarios = [];
  let opcoesPorLevantamento = {};
  let respostasPorLevantamento = {};
  let selectedId = null;

  // ── Proteção de Rota ──
  const user = JSON.parse(localStorage.getItem('sacc_usuario') || 'null');
  if (!user) {
    window.location.href = 'login.html';
  } else {
    document.getElementById('user-name').textContent = user.login;
  }

  // ── Funções Utilitárias ──
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
  }

  function showMsg(id, type, text) {
    const el = document.getElementById(id);
    el.className = `msg ${type}`;
    el.textContent = text;
  }

  function hideMsg(id) {
    const el = document.getElementById(id);
    el.className = 'msg';
    el.textContent = '';
  }

  function openModal(id) {
    document.getElementById(id).classList.add('open');
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  function closeModalIfOut(e, id) {
    if (e.target.id === id) closeModal(id);
  }

  // ── Carregar Dados ──
  async function loadData() {
    try {
      // Carregar levantamentos
      const levRes = await fetch(
        `${SUPABASE_URL}/rest/v1/levantamentos?order=id.desc`,
        { headers }
      );

      if (!levRes.ok) throw new Error('Erro ao carregar levantamentos');
      levantamentos = await levRes.json();

      // Carregar funcionários
      const funcRes = await fetch(
        `${SUPABASE_URL}/rest/v1/funcionarios?select=id,nome,setor&order=nome.asc`,
        { headers }
      );

      if (!funcRes.ok) throw new Error('Erro ao carregar funcionários');
      funcionarios = await funcRes.json();

      console.log('Levantamentos:', levantamentos);
      console.log('Funcionários:', funcionarios);

      renderSidebar();
    } catch (err) {
      console.error(err);
      showToast('Erro ao carregar dados');
    }
  }

  // ── Renderizar Sidebar ──
  function renderSidebar() {
    const list = document.getElementById('sidebar-list');

    if (!levantamentos.length) {
      list.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--gray); font-size: 13px;">Nenhum levantamento criado</div>`;
      return;
    }

    list.innerHTML = levantamentos.map(l => `
      <div class="sidebar-item ${selectedId === l.id ? 'active' : ''}" onclick="selectLevantamento(${l.id})">
        <div class="sidebar-dot"></div>
        <div class="sidebar-text">${l.assunto}</div>
        <button class="sidebar-delete" onclick="event.stopPropagation(); deleteLevantamento(${l.id})" title="Deletar">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>
      </div>
    `).join('');
  }

  // ── Selecionar Levantamento ──
  async function selectLevantamento(id) {
    selectedId = id;
    renderSidebar();
    await carregarDadosLevantamento(id);
    renderMainContent(id);
  }

  // ── Carregar dados do levantamento ──
  async function carregarDadosLevantamento(levantamentoId) {
    try {
      // Carregar opções
      const opcoesRes = await fetch(
        `${SUPABASE_URL}/rest/v1/levantamento_opcoes?levantamento_id=eq.${levantamentoId}&order=numero.asc`,
        { headers }
      );

      if (!opcoesRes.ok) throw new Error('Erro ao carregar opções');
      opcoesPorLevantamento[levantamentoId] = await opcoesRes.json();

      // Carregar respostas
      const respostasRes = await fetch(
        `${SUPABASE_URL}/rest/v1/levantamento_respostas?levantamento_id=eq.${levantamentoId}`,
        { headers }
      );

      if (!respostasRes.ok) throw new Error('Erro ao carregar respostas');
      respostasPorLevantamento[levantamentoId] = await respostasRes.json();

      console.log('Opções:', opcoesPorLevantamento[levantamentoId]);
      console.log('Respostas:', respostasPorLevantamento[levantamentoId]);
    } catch (err) {
      console.error(err);
      showToast('Erro ao carregar dados do levantamento');
    }
  }

  // ── Renderizar Conteúdo Principal ──
  function renderMainContent(id) {
    const lev = levantamentos.find(l => l.id === id);
    if (!lev) return;

    const opcoes = opcoesPorLevantamento[id] || [];
    const respostas = respostasPorLevantamento[id] || [];

    // Criar mapa de respostas por funcionário
    const respostasPorFunc = {};
    respostas.forEach(resp => {
      respostasPorFunc[resp.funcionario_id] = resp.opcao_id;
    });

    // Contar votos por opção
    const votosPorOpcao = {};
    opcoes.forEach(opc => {
      votosPorOpcao[opc.id] = respostas.filter(r => r.opcao_id === opc.id).length;
    });

    // HTML das estatísticas
    const statsHTML = opcoes.length > 0 ? `
      <div class="stats">
        ${opcoes.map(opc => `
          <div class="stat-card">
            <div class="stat-label">${opc.texto}</div>
            <div class="stat-value">${votosPorOpcao[opc.id] || 0}</div>
            <div class="stat-opcao">${funcionarios.length > 0 ? Math.round((votosPorOpcao[opc.id] / funcionarios.length) * 100) : 0}%</div>
          </div>
        `).join('')}
      </div>
    ` : '';

    // HTML da tabela
    const linhas = funcionarios.map(f => {
      const botoes = opcoes.map(opc => {
        const isSelected = respostasPorFunc[f.id] === opc.id;
        return `
          <button class="btn-opcao ${isSelected ? 'selected' : ''}" 
                  data-lev-id="${id}" 
                  data-func-id="${f.id}" 
                  data-opcao-id="${opc.id}" 
                  onclick="saveResponse(event)">
            ${opc.texto}
          </button>
        `;
      }).join('');

      return `
        <tr>
          <td class="td-nome">${f.nome}</td>
          <td class="td-setor">${f.setor || '—'}</td>
          <td><div class="opcoes">${botoes}</div></td>
        </tr>
      `;
    }).join('');

    const mainEl = document.getElementById('main-content');
    mainEl.innerHTML = `
      <div>
        <div class="titulo">${lev.assunto}</div>
        ${lev.descricao ? `<p style="font-size: 13px; color: var(--gray); margin-bottom: 16px;">${lev.descricao}</p>` : ''}
        
        ${statsHTML}
        
        <div class="filtros">
          <input type="text" class="filtro-input" id="filtro-nome" placeholder="Filtrar por nome..." oninput="filterTable()">
          <input type="text" class="filtro-input" id="filtro-setor" placeholder="Filtrar por setor..." oninput="filterTable()">
        </div>

        <table class="tabela">
          <thead>
            <tr>
              <th style="width: 30%;">Nome</th>
              <th style="width: 20%;">Setor</th>
              <th style="text-align: right;">Respostas</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo">${linhas}</tbody>
        </table>
      </div>
    `;
  }

  // ── Filtrar Tabela ──
  function filterTable() {
    const nomeFilter = document.getElementById('filtro-nome').value.toLowerCase();
    const setorFilter = document.getElementById('filtro-setor').value.toLowerCase();

    document.querySelectorAll('#tabela-corpo tr').forEach(row => {
      const nome = row.cells[0].textContent.toLowerCase();
      const setor = row.cells[1].textContent.toLowerCase();
      row.style.display = (nome.includes(nomeFilter) && setor.includes(setorFilter)) ? '' : 'none';
    });
  }

  // ── Salvar Resposta ──
  async function saveResponse(event) {
    event.stopPropagation();
    
    const btn = event.target.closest('.btn-opcao');
    if (!btn) return;
    
    const levId = parseInt(btn.dataset.levId);
    const funcId = parseInt(btn.dataset.funcId);
    const opcaoId = parseInt(btn.dataset.opcaoId);

    try {
      // Primeiro, deletar resposta anterior deste funcionário (se existir)
      const respostasAnteriores = respostasPorLevantamento[levId] || [];
      const respostaAntiga = respostasAnteriores.find(r => r.funcionario_id === funcId);

      if (respostaAntiga) {
        await fetch(
          `${SUPABASE_URL}/rest/v1/levantamento_respostas?id=eq.${respostaAntiga.id}`,
          {
            method: 'DELETE',
            headers: { ...headers, 'Prefer': 'return=minimal' },
          }
        );
      }

      // Depois, criar nova resposta
      await fetch(`${SUPABASE_URL}/rest/v1/levantamento_respostas`, {
        method: 'POST',
        headers: { ...headers, 'Prefer': 'return=minimal' },
        body: JSON.stringify({
          levantamento_id: levId,
          funcionario_id: funcId,
          opcao_id: opcaoId,
        }),
      });

      showToast('Resposta salva!');
      await carregarDadosLevantamento(levId);
      renderMainContent(levId);
    } catch (err) {
      console.error(err);
      showToast('Erro ao salvar resposta');
    }
  }

  // ── Abrir Modal ──
  function openNewModal() {
    document.getElementById('assunto').value = '';
    document.getElementById('descricao').value = '';
    document.querySelectorAll('.opcao-input').forEach(el => el.value = '');
    hideMsg('msg-novo');
    openModal('modal-novo');
  }

  // ── Criar Levantamento ──
  async function createLevantamento() {
    const assunto = document.getElementById('assunto').value.trim();
    const descricao = document.getElementById('descricao').value.trim();
    const opcoesInputs = document.querySelectorAll('.opcao-input');
    
    hideMsg('msg-novo');

    if (!assunto) {
      showMsg('msg-novo', 'error', 'Informe o título');
      return;
    }

    const opcoesFiltradas = Array.from(opcoesInputs)
      .map((el, i) => ({ numero: i + 1, texto: el.value.trim() }))
      .filter(op => op.texto);

    if (opcoesFiltradas.length === 0) {
      showMsg('msg-novo', 'error', 'Informe pelo menos uma opção');
      return;
    }

    const btn = document.getElementById('btn-criar');
    btn.disabled = true;

    try {
      // 1. Criar levantamento
      const levRes = await fetch(`${SUPABASE_URL}/rest/v1/levantamentos`, {
        method: 'POST',
        headers: { ...headers, 'Prefer': 'return=representation' },
        body: JSON.stringify({
          assunto,
          descricao: descricao || null,
          ativo: true,
        }),
      });

      if (!levRes.ok) throw new Error('Erro ao criar levantamento');
      const levantamento = await levRes.json();
      const levId = levantamento[0]?.id;

      if (!levId) throw new Error('ID do levantamento não retornado');

      // 2. Criar opções
      const opcoesPromises = opcoesFiltradas.map(op =>
        fetch(`${SUPABASE_URL}/rest/v1/levantamento_opcoes`, {
          method: 'POST',
          headers: { ...headers, 'Prefer': 'return=minimal' },
          body: JSON.stringify({
            levantamento_id: levId,
            numero: op.numero,
            texto: op.texto,
          }),
        })
      );

      await Promise.all(opcoesPromises);

      closeModal('modal-novo');
      showToast('Levantamento criado!');
      loadData();
    } catch (err) {
      console.error(err);
      showMsg('msg-novo', 'error', 'Erro ao criar levantamento');
    } finally {
      btn.disabled = false;
    }
  }

  // ── Deletar Levantamento ──
  async function deleteLevantamento(id) {
    if (!confirm('Tem certeza que deseja deletar este levantamento?')) return;

    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/levantamentos?id=eq.${id}`,
        {
          method: 'DELETE',
          headers: { ...headers, 'Prefer': 'return=minimal' },
        }
      );

      if (!res.ok) throw new Error('Erro ao deletar');

      selectedId = null;
      showToast('Levantamento deletado!');
      loadData();
      
      document.getElementById('main-content').innerHTML = `
        <div class="empty-state">
          <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <p class="empty-text">Selecione um levantamento para começar</p>
        </div>
      `;
    } catch (err) {
      console.error(err);
      showToast('Erro ao deletar');
    }
  }

  // ── Logout ──
  function logout() {
    localStorage.removeItem('sacc_usuario');
    window.location.href = 'login.html';
  }

  // ── ESC fecha modal ──
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal('modal-novo');
  });

  // ── Init ──
  loadData();
</script>
</body>
</html>
