<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SACC — Banco de Horas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #1e3a5f;
      --navy-light:  #2a4a72;
      --white:       #ffffff;
      --gray:        #6b7280;
      --gray-light:  #f3f5f8;
      --border:      #d1dae6;
      --danger:      #dc2626;
      --danger-bg:   #fef2f2;
      --danger-border:#fecaca;
      --success:     #16a34a;
      --success-bg:  #f0fdf4;
      --success-border:#bbf7d0;
      --warning:     #d97706;
      --warning-bg:  #fffbeb;
      --warning-border:#fde68a;
      --row-hover:   #f0f4fa;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--gray-light);
      color: var(--navy);
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    .topbar-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
    }

    .topbar-title {
      font-size: 13px;
      color: var(--gray);
      font-weight: 400;
    }

    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 8px;
    }

    .nav-link {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray);
      text-decoration: none;
      padding: 6px 13px;
      border-radius: 6px;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .nav-link:hover { background: var(--gray-light); color: var(--navy); }
    .nav-link.active {
      background: #e8eef7;
      color: var(--navy);
      font-weight: 600;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-user {
      font-size: 12px;
      color: var(--gray);
    }
    .topbar-user strong { color: var(--navy); font-weight: 600; }

    .btn-sair-top {
      font-size: 12px;
      color: var(--gray);
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 12px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all .15s;
    }
    .btn-sair-top:hover { border-color: var(--navy); color: var(--navy); }

    /* ── Content ── */
    .content {
      max-width: 960px;
      margin: 36px auto;
      padding: 0 24px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .page-header h1 { font-size: 18px; font-weight: 600; color: var(--navy); }
    .page-header p  { font-size: 12px; color: var(--gray); margin-top: 2px; }

    /* ── Search bar ── */
    .search-wrap {
      margin-bottom: 14px;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #b0bac8;
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--navy);
      background: var(--white);
      outline: none;
      transition: border-color .15s;
    }
    .search-wrap input::placeholder { color: #b0bac8; }
    .search-wrap input:focus { border-color: var(--navy); }

    /* ── Table ── */
    .table-wrap {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    thead tr {
      background: var(--gray-light);
      border-bottom: 1px solid var(--border);
    }

    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--gray);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 11px 16px;
    }
    thead th.th-action { text-align: right; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--row-hover); }

    tbody td {
      padding: 13px 16px;
      font-size: 13px;
      color: var(--navy);
    }

    .td-matricula {
      font-weight: 500;
      color: var(--gray);
      font-size: 12px;
      font-family: 'Inter', monospace;
    }

    .td-setor {
      display: inline-block;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 20px;
      background: #e8eef7;
      color: var(--navy);
      font-weight: 500;
    }

    /* ── Badge banco de horas ── */
    .bh-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .bh-badge.positivo { background: var(--success-bg); color: var(--success); }
    .bh-badge.neutro   { background: var(--gray-light);  color: var(--gray); }
    .bh-badge.negativo { background: var(--danger-bg);   color: var(--danger); }

    .td-action {
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      color: #b0bac8;
      padding: 5px 9px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      transition: color .15s, background .15s;
    }
    .btn-icon.alterar:hover { color: var(--navy); background: #e8eef7; }

    /* ── Empty / Loading ── */
    .empty {
      text-align: center;
      padding: 52px 24px;
      color: var(--gray);
    }
    .empty svg { margin-bottom: 12px; opacity: .35; }
    .empty p { font-size: 13px; }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--gray);
      font-size: 13px;
    }

    /* ── Feedback msg ── */
    .msg {
      font-size: 12px;
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      text-align: left;
      display: none;
    }
    .msg.error   { background: var(--danger-bg);  color: var(--danger);  border: 1px solid var(--danger-border);  display: block; }
    .msg.success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); display: block; }
    .msg.warning { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); display: block; }

    /* ── Spinner ── */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal shared ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.32);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
      z-index: 100;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.15);
      transform: translateY(12px);
      transition: transform .2s;
      width: 400px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .overlay.open .modal { transform: translateY(0); }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 24px 18px 24px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 { font-size: 15px; font-weight: 600; color: var(--navy); }

    .modal-body {
      padding: 22px 24px 24px 24px;
      overflow-y: auto;
      flex: 1;
    }

    .btn-close {
      background: none; border: none; cursor: pointer;
      color: var(--gray); padding: 2px;
      display: flex; align-items: center;
      transition: color .15s;
    }
    .btn-close:hover { color: var(--navy); }

    /* ── Modal funcionário info ── */
    .modal-func-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--gray-light);
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .modal-func-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: #e8eef7;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: var(--navy);
      flex-shrink: 0;
    }

    .modal-func-nome { font-size: 13px; font-weight: 600; color: var(--navy); }
    .modal-func-sub  { font-size: 11px; color: var(--gray); margin-top: 1px; }

    .modal-func-bh {
      margin-left: auto;
      text-align: right;
    }
    .modal-func-bh .bh-val {
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1;
    }
    .modal-func-bh .bh-label {
      font-size: 10px;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-top: 2px;
    }

    /* ── Form fields ── */
    .field { margin-bottom: 14px; text-align: left; }
    .field label {
      display: block; font-size: 12px; font-weight: 500;
      color: var(--navy); margin-bottom: 6px;
    }
    .field input, .field textarea, .field select {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--navy);
      background: var(--white);
      outline: none;
      transition: border-color .15s;
    }
    .field input::placeholder,
    .field textarea::placeholder { color: #b0bac8; }
    .field input:focus,
    .field textarea:focus,
    .field select:focus { border-color: var(--navy); }
    .field textarea { resize: vertical; min-height: 72px; }

    .field-hint {
      font-size: 11px;
      color: var(--gray);
      margin-top: 4px;
    }

    /* ── Botões modais ── */
    .btn-primary {
      width: 100%; margin-top: 6px; padding: 11px;
      border: none; border-radius: 6px;
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s;
      color: #fff;
    }
    .btn-primary.green { background: var(--success); }
    .btn-primary.green:hover { background: #15803d; }
    .btn-primary.red   { background: var(--danger); }
    .btn-primary.red:hover   { background: #b91c1c; }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

    /* ── Histórico ── */
    .historico-titulo {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray);
      letter-spacing: .6px;
      text-transform: uppercase;
      margin-bottom: 10px;
      margin-top: 20px;
    }

    .historico-lista {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #d1dae6 transparent;
    }

    .historico-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      background: var(--gray-light);
    }

    .historico-item .hi-desc { color: var(--navy); font-weight: 500; flex: 1; }
    .historico-item .hi-data { color: var(--gray); font-size: 11px; margin: 0 10px; white-space: nowrap; }
    .historico-item .hi-val  { font-weight: 700; white-space: nowrap; }
    .historico-item.entrada .hi-val { color: var(--success); }
    .historico-item.saida   .hi-val { color: var(--danger); }
    .historico-vazio { font-size: 12px; color: var(--gray); text-align: center; padding: 14px 0; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--navy); color: #fff;
      font-size: 13px; padding: 11px 18px;
      border-radius: 7px;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
      opacity: 0; transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<!-- ── Topbar ── -->
<div class="topbar">
  <div class="topbar-left">
    <span class="logo">SACC</span>
    <div class="topbar-sep"></div>
    <span class="topbar-title">Sistema Administrativo</span>
    <div class="topbar-sep"></div>
    <nav class="topbar-nav">
      <a href="dashboard.html" class="nav-link">Funcionários</a>
      <a href="bancohoras.html" class="nav-link active">Banco de Horas</a>
      <a href="ferias.html" class="nav-link">Férias</a>
	  <a href="escala.html" class="nav-link">Escala</a>
	  <a href="levantamentos.html" class="nav-link">Levantamentos</a>
    </nav>
  </div>
  <div class="topbar-right">
    <span class="topbar-user">Olá, <strong id="topbar-nome">—</strong></span>
    <button class="btn-sair-top" onclick="sair()">Sair</button>
  </div>
</div>

<!-- ── Content ── -->
<div class="content">
  <div class="page-header">
    <div>
      <h1>Banco de Horas</h1>
      <p id="count-label">Carregando...</p>
    </div>
  </div>

  <div class="search-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search-input" type="text" placeholder="Buscar por nome, matrícula ou setor..." oninput="filtrarTabela()"/>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Matrícula</th>
          <th>Nome</th>
          <th>Setor</th>
          <th>Banco de Horas</th>
          <th class="th-action">Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-body">
        <tr><td colspan="5"><div class="loading">Carregando funcionários...</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ── Modal: Alterar Banco de Horas ── -->
<div class="overlay" id="overlay-alterar" onclick="fecharFora(event,'overlay-alterar')">
  <div class="modal">
    <div class="modal-header">
      <h2>Alterar Banco de Horas</h2>
      <button class="btn-close" onclick="fecharModal('overlay-alterar')">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="modal-func-info">
        <div class="modal-func-avatar" id="alterar-avatar">—</div>
        <div>
          <div class="modal-func-nome" id="alterar-nome">—</div>
          <div class="modal-func-sub"  id="alterar-sub">—</div>
        </div>
        <div class="modal-func-bh">
          <div class="bh-val"   id="alterar-bh-val">0h</div>
          <div class="bh-label">Saldo atual</div>
        </div>
      </div>

      <div class="field">
        <label for="alterar-horas">Novo valor de horas</label>
        <input id="alterar-horas" type="number" step="0.5" placeholder="Ex: 8"/>
      </div>

      <button class="btn-primary green" id="btn-alterar-submit" onclick="handleAlterarBanco()">
        <span class="spinner" id="alterar-spinner"></span>
        <span id="alterar-label">Salvar</span>
      </button>
      <div class="msg" id="alterar-msg"></div>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script type="module">
  // ─────────────────────────────────────────
  // ⚙️  CONFIGURAÇÃO
  // ─────────────────────────────────────────
  const SUPABASE_URL      = 'https://uxtakyijomozrraazuxi.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV4dGFreWlqb21venJyYWF6dXhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MzgyNDIsImV4cCI6MjA5MDUxNDI0Mn0.uKeMN7NdNaLk9cyeli9BBZLjTLkPFbPqKic1mFfIJss';

  const headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
  };

  // ─────────────────────────────────────────
  // Proteção de rota
  // ─────────────────────────────────────────
  const usuarioLogado = JSON.parse(localStorage.getItem('sacc_usuario') || 'null');
  if (!usuarioLogado) {
    window.location.href = 'login.html';
  } else {
    document.getElementById('topbar-nome').textContent = usuarioLogado.login;
  }

  // ─────────────────────────────────────────
  // Estado
  // ─────────────────────────────────────────
  let funcionarios = [];
  let funcionarioSelecionadoId = null;

  // ─────────────────────────────────────────
  // Utilitários
  // ─────────────────────────────────────────
  function showMsg(id, type, text) {
    const el = document.getElementById(id);
    el.className = `msg ${type}`;
    el.textContent = text;
  }
  function hideMsg(id) {
    const el = document.getElementById(id);
    el.className = 'msg';
    el.textContent = '';
  }

  function setLoading(btnId, spinnerId, labelId, loading) {
    document.getElementById(btnId).disabled = loading;
    document.getElementById(spinnerId).style.display = loading ? 'inline-block' : 'none';
    document.getElementById(labelId).style.opacity   = loading ? '0' : '1';
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
  }

  function fecharModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  function fecharFora(e, id) {
    if (e.target.id === id) fecharModal(id);
  }

  function inicialNome(nome) {
    if (!nome) return '?';
    const partes = nome.trim().split(' ');
    return partes.length >= 2
      ? (partes[0][0] + partes[partes.length - 1][0]).toUpperCase()
      : partes[0][0].toUpperCase();
  }

  function formatarBH(val) {
    if (val === null || val === undefined) return '—';
    const v = parseFloat(val);
    if (isNaN(v)) return '—';
    return `${v > 0 ? '+' : ''}${v}h`;
  }

  function badgeClass(val) {
    if (val === null || val === undefined || val === 0) return 'neutro';
    return parseFloat(val) > 0 ? 'positivo' : 'negativo';
  }

  // ─────────────────────────────────────────
  // Carregar funcionários
  // ─────────────────────────────────────────
  async function carregarFuncionarios() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/funcionarios?select=id,nome,matricula,setor,bancohoras&order=nome.asc`,
        { headers }
      );
      if (!res.ok) throw new Error();
      funcionarios = await res.json();
      renderTabela(funcionarios);
      document.getElementById('count-label').textContent =
        `${funcionarios.length} funcionário${funcionarios.length !== 1 ? 's' : ''} cadastrado${funcionarios.length !== 1 ? 's' : ''}`;
    } catch {
      document.getElementById('tabela-body').innerHTML =
        `<tr><td colspan="5"><div class="empty"><p>Erro ao carregar. Tente novamente.</p></div></td></tr>`;
    }
  }

  // ─────────────────────────────────────────
  // Renderizar tabela
  // ─────────────────────────────────────────
  function renderTabela(lista) {
    const tbody = document.getElementById('tabela-body');
    if (!lista.length) {
      tbody.innerHTML = `<tr><td colspan="5"><div class="empty">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p>Nenhum funcionário encontrado.</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = lista.map(f => {
      const bh  = f.bancohoras ?? 0;
      const cls = badgeClass(bh);
      const bhStr = (bh === null || bh === undefined) ? '—' : `${bh > 0 ? '+' : ''}${bh}h`;
      return `
        <tr>
          <td class="td-matricula">${f.matricula || '—'}</td>
          <td>${f.nome}</td>
          <td><span class="td-setor">${f.setor || '—'}</span></td>
          <td><span class="bh-badge ${cls}">${bhStr}</span></td>
          <td>
            <div class="td-action">
              <button class="btn-icon alterar" onclick="abrirAlterar('${f.id}')" title="Alterar Banco de Horas">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Alterar Banco
              </button>
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  // ─────────────────────────────────────────
  // Busca
  // ─────────────────────────────────────────
  window.filtrarTabela = function() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const filtrado = funcionarios.filter(f =>
      (f.nome       || '').toLowerCase().includes(q) ||
      (f.matricula  || '').toLowerCase().includes(q) ||
      (f.setor      || '').toLowerCase().includes(q)
    );
    renderTabela(filtrado);
  };

  // ─────────────────────────────────────────
  // Abrir modal Alterar
  // ─────────────────────────────────────────
  window.abrirAlterar = function(id) {
    const f = funcionarios.find(x => String(x.id) === String(id));
    if (!f) return;
    funcionarioSelecionadoId = f.id;

    document.getElementById('alterar-avatar').textContent = inicialNome(f.nome);
    document.getElementById('alterar-nome').textContent   = f.nome;
    document.getElementById('alterar-sub').textContent    = `${f.matricula || '—'} · ${f.setor || '—'}`;

    const bh = f.bancohoras ?? 0;
    document.getElementById('alterar-bh-val').textContent = `${bh > 0 ? '+' : ''}${bh}h`;

    document.getElementById('alterar-horas').value = bh || '';
    hideMsg('alterar-msg');

    document.getElementById('overlay-alterar').classList.add('open');
    document.getElementById('alterar-horas').focus();
  };

  // ─────────────────────────────────────────
  // Alterar Banco de Horas
  // ─────────────────────────────────────────
  window.handleAlterarBanco = async function() {
    const novoValor = parseFloat(document.getElementById('alterar-horas').value);
    hideMsg('alterar-msg');

    if (isNaN(novoValor)) {
      showMsg('alterar-msg', 'error', 'Informe um valor de horas válido.');
      return;
    }

    setLoading('btn-alterar-submit', 'alterar-spinner', 'alterar-label', true);

    try {
      const f = funcionarios.find(x => String(x.id) === String(funcionarioSelecionadoId));

      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/funcionarios?id=eq.${funcionarioSelecionadoId}`,
        {
          method: 'PATCH',
          headers: { ...headers, 'Prefer': 'return=minimal' },
          body: JSON.stringify({ bancohoras: novoValor }),
        }
      );
      if (!res.ok) throw new Error('Erro ao atualizar saldo.');

      f.bancohoras = novoValor;

      fecharModal('overlay-alterar');
      toast(`Banco de horas alterado para ${novoValor}h.`);
      renderTabela(funcionarios);

    } catch (err) {
      showMsg('alterar-msg', 'error', err.message || 'Erro inesperado.');
    } finally {
      setLoading('btn-alterar-submit', 'alterar-spinner', 'alterar-label', false);
    }
  };

  // ─────────────────────────────────────────
  // Sair
  // ─────────────────────────────────────────
  window.sair = function() {
    localStorage.removeItem('sacc_usuario');
    window.location.href = 'login.html';
  };

  // Esc fecha modais
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      fecharModal('overlay-alterar');
    }
  });

  // ─────────────────────────────────────────
  // Init
  // ─────────────────────────────────────────
  carregarFuncionarios();
</script>
</body>
</html>
