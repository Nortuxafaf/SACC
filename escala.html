<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SACC — Escala</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #1e3a5f;
      --navy-light:  #2a4a72;
      --white:       #ffffff;
      --gray:        #6b7280;
      --gray-light:  #f3f5f8;
      --border:      #d1dae6;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--gray-light);
      color: var(--navy);
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    .topbar-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
    }

    .topbar-title {
      font-size: 13px;
      color: var(--gray);
      font-weight: 400;
    }

    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 8px;
    }

    .nav-link {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray);
      text-decoration: none;
      padding: 6px 13px;
      border-radius: 6px;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .nav-link:hover { background: var(--gray-light); color: var(--navy); }
    .nav-link.active {
      background: #e8eef7;
      color: var(--navy);
      font-weight: 600;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-user {
      font-size: 12px;
      color: var(--gray);
    }
    .topbar-user strong { color: var(--navy); font-weight: 600; }

    .btn-sair-top {
      font-size: 12px;
      color: var(--gray);
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 12px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all .15s;
    }
    .btn-sair-top:hover { border-color: var(--navy); color: var(--navy); }

    /* ── Content ── */
    .content {
      max-width: 960px;
      margin: 36px auto;
      padding: 0 24px;
      text-align: center;
    }

    .coming-soon {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 60px 40px;
      margin-top: 40px;
    }

    .coming-soon h1 {
      font-size: 32px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 16px;
    }

    .coming-soon p {
      font-size: 16px;
      color: var(--gray);
      margin-bottom: 32px;
    }

    .coming-soon-icon {
      font-size: 64px;
      margin-bottom: 24px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

<!-- ── Topbar ── -->
<div class="topbar">
  <div class="topbar-left">
    <span class="logo">SACC</span>
    <div class="topbar-sep"></div>
    <span class="topbar-title">Sistema Administrativo</span>
    <div class="topbar-sep"></div>
    <nav class="topbar-nav">
      <a href="dashboard.html" class="nav-link">Funcionários</a>
      <a href="bancohoras.html" class="nav-link">Banco de Horas</a>
      <a href="ferias.html" class="nav-link">Férias</a>
      <a href="escala.html" class="nav-link active">Escala</a>
	  <a href="levantamentos.html" class="nav-link">Levantamentos</a>
    </nav>
  </div>
  <div class="topbar-right">
    <span class="topbar-user">Olá, <strong id="topbar-nome">—</strong></span>

  </div>
</div>

<!-- ── Content ── -->

</div>

</body>
</html>
